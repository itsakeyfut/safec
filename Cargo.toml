[workspace]
resolver = "3"
members = ["crates/safec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["itsakeyfut <itsakey0xff@gmail.com>"]
repository = "https://github.com/itsakeyfut/safec"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ariadne = "0.6.0"
thiserror = "2.0.20"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2