[package]
name = "safec"
description = "A small, hackable, safety-oriented C compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "safec"
path = "src/main.rs"

# A measurement that asserts nothing and prints a table: its own `main`,
# since the built-in bench harness needs a nightly compiler.
[[bench]]
name = "growth"
harness = false

[dependencies]
safec-ir = { path = "../safec-ir" }
safec-llvm = { path = "../safec-llvm" }
clap.workspace = true
ariadne.workspace = true
unicode-width.workspace = true

[lints]
workspace = true
